name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LuiPFileManager.sln

      - name: Build
        run: dotnet build LuiPFileManager.sln --configuration Release --no-restore

      - name: Publish app (win-x64)
        run: dotnet publish LuiP.FileManager.App/LuiP.FileManager.App.csproj --configuration Release --runtime win-x64 --self-contained false --output release/publish

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path release/publish/* -DestinationPath release/LuiP.FileManager-win-x64.zip -Force

      - name: Create GitHub release and upload artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/LuiP.FileManager-win-x64.zip
          generate_release_notes: true
