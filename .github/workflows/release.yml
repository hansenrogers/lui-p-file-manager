name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LuiPFileManager.sln

      - name: Build
        run: dotnet build LuiPFileManager.sln --configuration Release --no-restore

      - name: Publish app (win-x64)
        run: dotnet publish LuiP.FileManager.App/LuiP.FileManager.App.csproj --configuration Release --runtime win-x64 --self-contained false --output release/publish

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path release/publish/* -DestinationPath release/LuiP.FileManager-win-x64.zip -Force

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash -Path release/LuiP.FileManager-win-x64.zip -Algorithm SHA256
          "SHA256 ($($hash.Path)) = $($hash.Hash)" | Out-File -FilePath release/LuiP.FileManager-win-x64.zip.sha256 -Encoding ascii

      - name: Generate changelog
        shell: pwsh
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $prevTag = git tag --sort=-creatordate | Where-Object { $_ -ne $tag } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($prevTag)) {
            $range = $tag
            $heading = "Changes in $tag"
          } else {
            $range = "$prevTag..$tag"
            $heading = "Changes from $prevTag to $tag"
          }

          $log = git log $range --pretty=format:"- %s (%h)" | Out-String
          if ([string]::IsNullOrWhiteSpace($log.Trim())) {
            $log = "- No commit messages found for this range."
          }

          @(
            "# $heading"
            ""
            $log.TrimEnd()
            ""
            "## Artifacts"
            ""
            "- LuiP.FileManager-win-x64.zip"
            "- LuiP.FileManager-win-x64.zip.sha256"
          ) | Out-File -FilePath release/CHANGELOG.md -Encoding utf8

      - name: Create GitHub release and upload artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release/CHANGELOG.md
          files: |
            release/LuiP.FileManager-win-x64.zip
            release/LuiP.FileManager-win-x64.zip.sha256
            release/CHANGELOG.md
          generate_release_notes: true
