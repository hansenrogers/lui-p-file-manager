name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LuiPFileManager.sln

      - name: Build
        run: dotnet build LuiPFileManager.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LuiP.FileManager.Tests/LuiP.FileManager.Tests.csproj --configuration Release --no-build --verbosity normal
